name: Windows NUL sandbox diagnostics
on:
  push:
    branches: [investigate/nul-git-compat]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build production helper bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'build/helper'
          & ./scripts/build-windows-helper.ps1 -OutputDirectory $out
          if ($LASTEXITCODE -ne 0) { throw 'Production helper build failed.' }
      - name: Compile native probes for both architectures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/programs | Out-Null
          foreach ($arch in @('x64', 'x86')) {
            $target = if ($arch -eq 'x64') { 'x86_64-pc-windows-msvc' } else { 'i686-pc-windows-msvc' }
            & clang-cl /nologo /std:c11 /O2 /W4 /WX /DUNICODE /D_UNICODE /clang:-target /clang:$target tests/windows-child.c /Fe:build/programs/windows-child-$arch.exe /link advapi32.lib ws2_32.lib
            if ($LASTEXITCODE -ne 0) { throw "windows-child $arch compilation failed." }
            & clang-cl /nologo /O2 /W4 /WX /DUNICODE /D_UNICODE /clang:-target /clang:$target tests/windows-process.c /Fe:build/programs/windows-process-$arch.exe /link advapi32.lib userenv.lib shell32.lib
            if ($LASTEXITCODE -ne 0) { throw "windows-process $arch compilation failed." }
          }
          Copy-Item build/helper/cl-exec-sandbox-windows.exe, build/helper/cl-exec-sandbox-compat64.dll, build/helper/cl-exec-sandbox-compat32.dll -Destination build/programs
      - name: Run native matrix as standard account
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "ClSandboxNul$PID"
          $root = Join-Path $env:PUBLIC $name
          $password = ConvertTo-SecureString (([Guid]::NewGuid().ToString('N')) + '!aA1') -AsPlainText -Force
          $user = $null
          try {
            $user = New-LocalUser -Name $name -Password $password -AccountNeverExpires
            New-Item -ItemType Directory -Path $root | Out-Null
            & icacls.exe $root /inheritance:r /grant:r "*$($user.SID.Value):(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare the private fixture.' }
            $programs = New-Item -ItemType Directory -Path (Join-Path $root 'programs')
            Copy-Item build/programs/* -Destination $programs.FullName
            Copy-Item scripts/probe-windows-nul.ps1 -Destination (Join-Path $root 'probe.ps1')
            $git = (Get-Command git.exe -CommandType Application | Select-Object -First 1).Source
            $gitRoot = Split-Path (Split-Path $git -Parent) -Parent
            if (-not (Test-Path -LiteralPath (Join-Path $gitRoot 'cmd/git.exe'))) { throw 'Cannot identify the native Git installation.' }
            Copy-Item -Recurse -LiteralPath $gitRoot -Destination (Join-Path $root 'git')
            $pwsh = (Get-Command pwsh.exe -CommandType Application | Select-Object -First 1).Source
            $credential = [Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$name", $password)
            $process = Start-Process -FilePath $pwsh -Credential $credential -LoadUserProfile -PassThru -WorkingDirectory $root -ArgumentList @('-NoProfile', '-File', ('"' + (Join-Path $root 'probe.ps1') + '"')) -RedirectStandardOutput (Join-Path $root 'output.log') -RedirectStandardError (Join-Path $root 'error.log')
            if (-not $process.WaitForExit(1500000)) { Stop-Process -Id $process.Id -Force; throw 'Native NUL diagnostics timed out.' }
            $process.Refresh()
            Get-Content -LiteralPath (Join-Path $root 'output.log')
            Get-Content -LiteralPath (Join-Path $root 'error.log')
            if ($process.ExitCode -ne 0) { throw "Native diagnostic harness failed: $($process.ExitCode)" }
          } finally {
            if ($user) {
              Get-CimInstance Win32_UserProfile | Where-Object SID -eq $user.SID.Value | Remove-CimInstance
              Remove-LocalUser -Name $name
            }
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }
